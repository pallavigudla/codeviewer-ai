<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — Code Review Agent</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background-color: var(--bg-primary);">
    <div class="card" style="width: 100%; max-width: 440px; padding: 2rem;">
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <div class="sidebar-logo" style="margin: 0 auto 0.75rem; width: 44px; height: 44px; font-size: 1.25rem;"><i class="fa-solid fa-code"></i></div>
            <h2 style="font-size: 1.5rem; font-weight: 700;">Create Account</h2>
            <p style="color: var(--text-secondary); font-size: 0.875rem;">Join Code Review Agent Platform</p>
        </div>

        <div id="reg-alert" style="display: none; padding: 0.75rem; border-radius: var(--radius); font-size: 0.85rem; margin-bottom: 1rem;"></div>

        <form id="register-form">
            <div class="form-group">
                <label class="form-label">Full Name</label>
                <input type="text" id="reg-fullname" class="form-input" placeholder="Full Name" required>
            </div>
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" id="reg-username" class="form-input" placeholder="Username" required>
            </div>
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" id="reg-email" class="form-input" placeholder="developer@example.com" required>
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" id="reg-password" class="form-input" placeholder="At least 6 characters" minlength="6" required>
            </div>
            <button type="submit" class="btn btn-primary" id="reg-submit-btn" style="width: 100%; justify-content: center; margin-top: 0.5rem;">
                <i class="fa-solid fa-paper-plane"></i> Register & Send 6-Digit OTP
            </button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem; color: var(--text-secondary);">
            Already have an account? <a href="/login.html" style="color: var(--accent-primary); font-weight: 600; text-decoration: none;">Sign In</a>
        </div>
    </div>

    <!-- OTP Verification Modal -->
    <div class="modal-overlay" id="otp-modal">
        <div class="modal-content" style="max-width: 400px; text-align: center;">
            <div class="modal-header" style="justify-content: center;">
                <div class="modal-title" style="font-size: 1.2rem;"><i class="fa-solid fa-shield-halved" style="color: var(--accent-primary);"></i> Verify Email OTP</div>
            </div>
            <p style="font-size: 0.875rem; color: var(--text-secondary); margin: 0.75rem 0 1.25rem;">
                Enter the 6-digit OTP code sent to <br><strong id="otp-recipient-email" style="color: var(--text-primary);"></strong> <br>(Expires in 5 minutes).
            </p>

            <div id="otp-alert" style="display: none; padding: 0.6rem; border-radius: var(--radius); font-size: 0.85rem; margin-bottom: 1rem;"></div>

            <form id="otp-form">
                <div class="form-group">
                    <input type="text" id="otp-code" class="form-input" placeholder="123456" maxlength="6" style="text-align: center; font-size: 1.5rem; letter-spacing: 0.25em; font-weight: 700;" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-bottom: 0.75rem;">
                    <i class="fa-solid fa-circle-check"></i> Verify OTP & Activate Account
                </button>
            </form>

            <div style="margin-top: 1rem; font-size: 0.85rem;">
                <button type="button" class="btn btn-secondary" id="resend-otp-btn" style="width: 100%; justify-content: center;" disabled>
                    Resend OTP (<span id="resend-timer">30</span>s)
                </button>
            </div>
        </div>
    </div>

<script src="/js/app.js"></script>
<script>
    let registeredEmail = '';
    let resendCountdown = 30;
    let timerInterval = null;

    document.getElementById('register-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const alertBox = document.getElementById('reg-alert');
        const submitBtn = document.getElementById('reg-submit-btn');

        const fullName = document.getElementById('reg-fullname').value;
        const username = document.getElementById('reg-username').value;
        const email = document.getElementById('reg-email').value;
        const password = document.getElementById('reg-password').value;

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Sending OTP...';

        try {
            const res = await apiCall('/api/auth/register', 'POST', { fullName, username, email, password });
            registeredEmail = email;
            document.getElementById('otp-recipient-email').textContent = email;
            document.getElementById('otp-modal').classList.add('active');
            startResendTimer();
        } catch (err) {
            alertBox.style.display = 'block';
            alertBox.style.backgroundColor = 'rgba(239, 68, 68, 0.15)';
            alertBox.style.color = 'var(--danger)';
            alertBox.textContent = err.message || 'Registration failed.';
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Register & Send 6-Digit OTP';
        }
    });

    document.getElementById('otp-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const alertBox = document.getElementById('otp-alert');
        const otpCode = document.getElementById('otp-code').value.trim();

        try {
            const res = await apiCall('/api/auth/verify-email', 'POST', { email: registeredEmail, otpCode });
            alertBox.style.display = 'block';
            alertBox.style.backgroundColor = 'rgba(16, 185, 129, 0.15)';
            alertBox.style.color = 'var(--success)';
            alertBox.textContent = res.message || 'Email verified! Account created successfully.';
            
            setTimeout(() => {
                window.location.href = '/login.html';
            }, 1200);
        } catch (err) {
            alertBox.style.display = 'block';
            alertBox.style.backgroundColor = 'rgba(239, 68, 68, 0.15)';
            alertBox.style.color = 'var(--danger)';
            alertBox.textContent = 'Invalid or Expired OTP.';
        }
    });

    function startResendTimer() {
        const btn = document.getElementById('resend-otp-btn');
        const timerSpan = document.getElementById('resend-timer');
        resendCountdown = 30;
        btn.disabled = true;
        timerSpan.textContent = resendCountdown;

        if (timerInterval) clearInterval(timerInterval);

        timerInterval = setInterval(() => {
            resendCountdown--;
            if (resendCountdown > 0) {
                timerSpan.textContent = resendCountdown;
            } else {
                clearInterval(timerInterval);
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-rotate-right"></i> Resend OTP';
            }
        }, 1000);
    }

    document.getElementById('resend-otp-btn').addEventListener('click', async () => {
        const alertBox = document.getElementById('otp-alert');
        try {
            const res = await apiCall(`/api/auth/resend-otp?email=${encodeURIComponent(registeredEmail)}`, 'POST');
            alertBox.style.display = 'block';
            alertBox.style.backgroundColor = 'rgba(16, 185, 129, 0.15)';
            alertBox.style.color = 'var(--success)';
            alertBox.textContent = res.message || 'New OTP sent to your email!';
            startResendTimer();
        } catch (err) {
            alertBox.style.display = 'block';
            alertBox.style.backgroundColor = 'rgba(239, 68, 68, 0.15)';
            alertBox.style.color = 'var(--danger)';
            alertBox.textContent = err.message || 'Failed to resend OTP.';
        }
    });
</script>
</body>
</html>
