# ==========================================
# Load .env file
# ==========================================
spring.config.import=optional:file:.env[.properties]

# ==========================================
# Server Configuration (Railway PORT support)
# ==========================================
server.port=${PORT:${SERVER_PORT:8080}}

# ==========================================
# Application Configuration
# ==========================================
spring.application.name=code-review-agent

# ==========================================
# PostgreSQL Datasource Configuration
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:codereview_agent}}}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# Hibernate & JPA Configuration
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ==========================================
# SQL & Hibernate Logging (Reduced for Production Security)
# ==========================================
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.springframework.orm.jpa=INFO
logging.level.com.codereviewagent=INFO

# ==========================================
# Schema Initialization Support (Non-Destructive)
# ==========================================
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true

# ==========================================
# EmailJS Configuration
# ==========================================
emailjs.service-id=${EMAILJS_SERVICE_ID:}
emailjs.template-id=${EMAILJS_TEMPLATE_ID:}
emailjs.public-key=${EMAILJS_PUBLIC_KEY:}
emailjs.private-key=${EMAILJS_PRIVATE_KEY:}

# ==========================================
# Groq AI Configuration
# ==========================================
groq.api-key=${GROQ_API_KEY:}
groq.api-url=${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}
groq.timeout-ms=${GROQ_TIMEOUT_MS:10000}

# ==========================================
# Hindsight Configuration
# ==========================================
hindsight.api-key=${HINDSIGHT_API_KEY:}
hindsight.base-url=${HINDSIGHT_BASE_URL:https://api.hindsight.vectorize.io}
hindsight.bank-id=${HINDSIGHT_BANK_ID:code-review-agent}
hindsight.workspace=${HINDSIGHT_WORKSPACE:default_workspace}
hindsight.collection=${HINDSIGHT_COLLECTION:code_reviews}